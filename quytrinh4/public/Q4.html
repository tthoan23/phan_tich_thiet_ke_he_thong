<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Panel - Homestay Dorm PMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            /* Nền xám nhạt chống mỏi mắt */
            color: #334155;
            /* Text Slate 700 */
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* App shell prevents body scroll */
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Custom Toggle Switch for Checklists */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #16a34a;
            background-color: #16a34a;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #16a34a;
        }

        .toggle-checkbox:checked+.toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }

        .toggle-checkbox.error:checked {
            border-color: #dc2626;
            background-color: #dc2626;
        }

        .toggle-checkbox.error:checked+.toggle-label {
            background-color: #dc2626;
        }

        /* Split View Resizer simulation */
        .split-divider {
            width: 4px;
            background-color: #e2e8f0;
            cursor: col-resize;
            transition: background-color 0.2s;
        }

        .split-divider:hover {
            background-color: #94a3b8;
        }

        /* Fake PDF */
        .pdf-viewer {
            background-image: repeating-linear-gradient(#ffffff 0px, #ffffff 24px, #f1f5f9 25px);
            line-height: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Room Grid Item Styles */
        .room-item.status-vacant {
            border-color: #86efac;
            background-color: #f0fdf4;
        }

        .room-item.status-occupied {
            border-color: #bfdbfe;
            background-color: #eff6ff;
        }

        .room-item.status-dirty {
            border-color: #d1d5db;
            background-color: #f3f4f6;
            opacity: 0.8;
        }

        .room-item.status-maintenance {
            border-color: #fca5a5;
            background-color: #fef2f2;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1d4ed8', /* Blue 700 - Action Main */
                        secondary: '#334155', /* Slate 700 - UI Main */
                        sidebar: '#0f172a', /* Slate 900 */
                        success: '#16a34a',
                        warning: '#ea580c',
                        danger: '#dc2626'
                    }
                }
            }
        }
    </script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- GEMINI API CONFIG ---
        const apiKey = "";

        // --- ICONS ---
        const Icons = {
            Dashboard: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></svg>,
            Key: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" /></svg>,
            FileCheck: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><polyline points="9 15 11 17 15 13" /></svg>,
            Box: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" y1="22.08" x2="12" y2="12" /></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>,
            Bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>,
            ChevronDown: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9" /></svg>,
            Camera: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle cx="12" cy="13" r="4" /></svg>,
            UserCheck: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><polyline points="17 11 19 13 23 9" /></svg>,
            UserMinus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="8.5" cy="7" r="4" /><line x1="23" y1="11" x2="17" y2="11" /></svg>,
            RefreshCw: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></svg>,
            AlertTriangle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></svg>,
            Sparkles: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3v18M3 12h18m-4.5-4.5l-9 9m9 0l-9-9" /></svg>,
            Shield: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>,
            CheckCircle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>,
            XCircle: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></svg>
        };

        // --- COMPONENTS ---
        const ToggleSwitch = ({ id, label, checked, onChange, isErrorColor }) => (
            <div className="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                <span className="text-sm font-medium text-secondary">{label}</span>
                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name={id} id={id} checked={checked} onChange={onChange} className={`toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 ${isErrorColor && checked ? 'error' : ''}`} style={{ borderColor: checked ? (isErrorColor ? '#dc2626' : '#16a34a') : '#cbd5e1' }} />
                    <label htmlFor={id} className="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 cursor-pointer"></label>
                </div>
            </div>
        );

        const AuditLog = ({ logs }) => (
            <div className="mt-4 pt-4 border-t border-slate-200">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Lịch sử hệ thống (Audit Log)</h4>
                <ul className="space-y-2">
                    {logs.map((log, i) => (
                        <li key={i} className="text-[11px] text-slate-500 flex">
                            <span className="w-24 font-mono text-slate-400">{log.time}</span>
                            <span>{log.action} bởi <strong className="text-secondary">{log.user}</strong></span>
                        </li>
                    ))}
                </ul>
            </div>
        );

        // --- VIEWS ---

        // 1. DASHBOARD VIEW
        const DashboardView = ({ navigate }) => (
            <div className="p-8 h-full overflow-y-auto">
                <div className="mb-8">
                    <h1 className="text-2xl font-bold text-secondary">Tổng quan vận hành - CN Quận 1</h1>
                    <p className="text-sm text-slate-500 mt-1">Dữ liệu cập nhật realtime ngày 10/05/2026</p>
                </div>

                {/* Metrics */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-primary flex items-center justify-between">
                        <div>
                            <p className="text-sm font-bold text-slate-500 uppercase tracking-wide">Dự kiến Check-in hôm nay</p>
                            <h3 className="text-3xl font-black text-secondary mt-1">05 <span className="text-sm font-medium text-slate-400">khách</span></h3>
                        </div>
                        <div className="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-primary"><Icons.UserCheck /></div>
                    </div>
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-warning flex items-center justify-between">
                        <div>
                            <p className="text-sm font-bold text-slate-500 uppercase tracking-wide">Dự kiến Check-out</p>
                            <h3 className="text-3xl font-black text-secondary mt-1">02 <span className="text-sm font-medium text-slate-400">khách</span></h3>
                        </div>
                        <div className="w-12 h-12 rounded-full bg-orange-50 flex items-center justify-center text-warning"><Icons.UserMinus /></div>
                    </div>
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-danger flex items-center justify-between">
                        <div>
                            <p className="text-sm font-bold text-slate-500 uppercase tracking-wide">Phòng cần Reset / Sự cố</p>
                            <h3 className="text-3xl font-black text-danger mt-1">03 <span className="text-sm font-medium text-slate-400">phòng</span></h3>
                        </div>
                        <div className="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center text-danger"><Icons.AlertTriangle /></div>
                    </div>
                </div>

                {/* Tasks List */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                        <h3 className="font-bold text-secondary uppercase tracking-wider text-sm">Việc cần làm ngay (Tasks)</h3>
                    </div>
                    <div className="divide-y divide-slate-100">
                        {[
                            { title: "Kiểm tra hồ sơ Check-in", desc: "Khách Nguyễn Văn A (Phòng 201) đã đến quầy", type: "checkin", time: "Vừa xong", urgency: "high" },
                            { title: "Nghiệm thu Check-out", desc: "Khách Trần Thị B (Phòng 305) yêu cầu trả phòng", type: "checkout", time: "15 phút trước", urgency: "high" },
                            { title: "Dọn dẹp phòng", desc: "Phòng 102 khách đã đi, tạp vụ báo hoàn thành", type: "clean", time: "1 tiếng trước", urgency: "medium" },
                            { title: "Duyệt hợp đồng", desc: "Có 2 hợp đồng mới Sale vừa đẩy lên", type: "contract", time: "2 tiếng trước", urgency: "low" },
                        ].map((task, i) => (
                            <div key={i} className="p-4 px-6 flex items-center justify-between hover:bg-slate-50 transition cursor-pointer" onClick={() => navigate(task.type === 'checkin' ? 'checkin' : (task.type === 'checkout' ? 'checkout' : 'rooms'))}>
                                <div className="flex items-center">
                                    <div className={`w-2 h-2 rounded-full mr-4 ${task.urgency === 'high' ? 'bg-red-500' : task.urgency === 'medium' ? 'bg-orange-500' : 'bg-blue-500'}`}></div>
                                    <div>
                                        <p className="font-bold text-secondary text-sm">{task.title}</p>
                                        <p className="text-xs text-slate-500 mt-0.5">{task.desc}</p>
                                    </div>
                                </div>
                                <div className="flex items-center">
                                    <span className="text-xs text-slate-400 mr-4">{task.time}</span>
                                    <button className="text-primary hover:bg-blue-50 px-3 py-1.5 rounded text-xs font-bold transition">Xử lý</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        // 2. CHECK-IN VIEW (Split Screen with AI Checking)
        const CheckInView = () => {
            const [checks, setChecks] = useState({ idMatch: false, genderMatch: false, capacityOk: false });
            const allChecked = Object.values(checks).every(Boolean);

            // Customer Details Form State
            const [customerInfo, setCustomerInfo] = useState({ age: 19, gender: 'Nam', occupation: 'Sinh viên' });

            // AI Checking State
            const [aiResult, setAiResult] = useState(null);
            const [isCheckingAI, setIsCheckingAI] = useState(false);

            const handleAnalyze = async () => {
                setIsCheckingAI(true);
                setAiResult(null);

                const prompt = `Bạn là hệ thống kiểm duyệt lưu trú. Hãy đánh giá hồ sơ khách hàng sau:
                - Thông tin khách: Giới tính ${customerInfo.gender}, Tuổi ${customerInfo.age}, Nghề nghiệp: ${customerInfo.occupation}.
                - Quy định phòng P.201: Dành cho KTX Nam, độ tuổi cho phép từ 18 - 25, đối tượng sinh viên hoặc người đi làm. Tối đa 1 người/giường.
                
                Hãy trả về KẾT QUẢ ĐÚNG ĐỊNH DẠNG JSON với cấu trúc sau:
                {
                    "isEligible": boolean,
                    "riskLevel": "THẤP" | "TRUNG BÌNH" | "CAO",
                    "message": "Giải thích chi tiết ngắn gọn tại sao hợp lệ hoặc vi phạm quy định."
                }`;

                if (!apiKey) {
                    // Mock API response
                    setTimeout(() => {
                        const isMale = customerInfo.gender.toLowerCase() === 'nam';
                        const isAgeOk = customerInfo.age >= 18 && customerInfo.age <= 25;
                        const isValid = isMale && isAgeOk;

                        setAiResult({
                            isEligible: isValid,
                            riskLevel: isValid ? "THẤP" : "CAO",
                            message: isValid
                                ? "Khách hàng thỏa mãn tất cả các điều kiện lưu trú của phòng P.201 (Nam, độ tuổi 18-25)."
                                : `Không thỏa mãn quy định phòng. ${!isMale ? "Sai giới tính (Phòng KTX Nam)." : ""} ${!isAgeOk ? "Độ tuổi không nằm trong khoảng cho phép (18-25)." : ""}`
                        });

                        // Optionally Auto-toggle checks if valid
                        if (isValid) {
                            setChecks(prev => ({ ...prev, genderMatch: true, capacityOk: true }));
                        } else {
                            setChecks(prev => ({ ...prev, genderMatch: false }));
                        }
                        setIsCheckingAI(false);
                    }, 1500);
                    return;
                }

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    const parsed = JSON.parse(text);
                    setAiResult(parsed);

                    if (parsed.isEligible) {
                        setChecks(prev => ({ ...prev, genderMatch: true, capacityOk: true }));
                    }
                } catch (e) {
                    setAiResult({ isEligible: false, riskLevel: "LỖI", message: "Lỗi kết nối với hệ thống phân tích AI." });
                }
                setIsCheckingAI(false);
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 relative overflow-hidden">
                    <div className="h-14 border-b border-slate-200 bg-white flex items-center justify-between px-4 shrink-0">
                        <div className="flex items-center">
                            <h2 className="font-bold text-secondary mr-4">Nghiệp vụ Check-in & Duyệt Hợp đồng</h2>
                            <span className="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded">Mã HĐ: HD-2026-0515</span>
                        </div>
                    </div>

                    <div className="flex-1 flex overflow-hidden">
                        {/* Left Panel: Verification Form */}
                        <div className="w-1/3 min-w-[400px] max-w-[450px] bg-white border-r border-slate-200 flex flex-col overflow-y-auto">
                            <div className="p-6">

                                {/* Thông tin chung */}
                                <h3 className="font-bold text-secondary mb-4 uppercase text-xs tracking-wider border-b pb-2">Thông tin Hợp đồng</h3>
                                <div className="space-y-2 text-sm mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                                    <div className="flex justify-between"><span className="text-slate-500">Khách hàng:</span> <span className="font-bold">Nguyễn Văn A</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">CCCD:</span> <span className="font-mono">079123456789</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Phòng thuê:</span> <span className="font-bold text-primary">P.201 (KTX Nam)</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">Trạng thái Cọc:</span> <span className="text-success font-bold">Đã thu</span></div>
                                </div>

                                {/* Form Kiểm tra điều kiện lưu trú */}
                                <div className="mb-6 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="font-bold text-indigo-900 flex items-center text-sm"><Icons.Shield /><span className="ml-1.5">Kiểm tra Điều kiện Lưu trú</span></h3>
                                    </div>
                                    <p className="text-xs text-slate-500 mb-3">Quản lý nhập thông tin thực tế từ CCCD/Phỏng vấn khách để kiểm tra tính hợp lệ với Quy định phòng.</p>

                                    <div className="grid grid-cols-2 gap-3 mb-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Tuổi thực tế</label>
                                            <input type="number" value={customerInfo.age} onChange={(e) => setCustomerInfo({ ...customerInfo, age: e.target.value })} className="w-full border border-slate-300 rounded p-1.5 text-sm outline-none focus:border-indigo-500" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Giới tính</label>
                                            <select value={customerInfo.gender} onChange={(e) => setCustomerInfo({ ...customerInfo, gender: e.target.value })} className="w-full border border-slate-300 rounded p-1.5 text-sm outline-none focus:border-indigo-500">
                                                <option value="Nam">Nam</option>
                                                <option value="Nữ">Nữ</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-600 mb-1">Nghề nghiệp</label>
                                            <input type="text" value={customerInfo.occupation} onChange={(e) => setCustomerInfo({ ...customerInfo, occupation: e.target.value })} className="w-full border border-slate-300 rounded p-1.5 text-sm outline-none focus:border-indigo-500" />
                                        </div>
                                    </div>

                                    <button onClick={handleAnalyze} disabled={isCheckingAI} className="w-full text-xs bg-indigo-600 text-white px-3 py-2 rounded-lg font-bold hover:bg-indigo-700 flex items-center justify-center transition disabled:opacity-50 shadow-sm">
                                        {isCheckingAI ? 'Đang phân tích...' : <><Icons.Sparkles /><span className="ml-1">Đánh giá bằng AI</span></>}
                                    </button>

                                    {/* AI Result Card */}
                                    {aiResult && (
                                        <div className={`mt-4 p-3 rounded-lg border text-sm ${aiResult.isEligible ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                            <div className="flex items-center font-bold mb-1">
                                                {aiResult.isEligible ? <span className="mr-1"><Icons.CheckCircle /></span> : <span className="mr-1"><Icons.XCircle /></span>}
                                                {aiResult.isEligible ? 'Hợp lệ - Đủ điều kiện nhận phòng' : 'Vi phạm quy định lưu trú!'}
                                            </div>
                                            <p className="text-xs mb-2 opacity-90 leading-relaxed">{aiResult.message}</p>
                                            <div className="flex items-center text-xs">
                                                <span className="font-bold opacity-80 mr-1">Mức độ rủi ro: </span>
