<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q3 - Hợp đồng & Cư dân</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFAFA;
      color: #111827;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .pdf-viewer-fake {
      background-image: repeating-linear-gradient(#ffffff 0px, #ffffff 30px, #f8fafc 31px);
      line-height: 31px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-animate { animation: slideInRight 0.25s ease-out forwards; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0f172a',
            teal: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' },
            coral: '#ff6b6b',
            surface: '#ffffff'
          },
          boxShadow: {
            soft: '0 10px 40px -10px rgba(0,0,0,0.08)',
            floating: '0 20px 40px -15px rgba(0,0,0,0.1)'
          }
        }
      }
    };
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const Icons = {
      Bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
      Globe: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
      Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      UserPlus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
      FileText: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
      CreditCard: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
      Trash2: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
      X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    };

    const Stepper = ({ currentStep }) => {
      const steps = ['Đặt cọc', 'Cập nhật Hồ sơ', 'Ký Hợp đồng', 'Nhận phòng'];
      return (
        <div className="w-full max-w-3xl mx-auto mb-10 pt-8">
          <div className="flex justify-between items-center relative">
            <div className="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 z-0 rounded-full"></div>
            <div className="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-teal-600 z-0 rounded-full" style={{ width: `${(currentStep / (steps.length - 1)) * 100}%` }}></div>
            {steps.map((step, index) => {
              const isCompleted = index < currentStep;
              const isActive = index === currentStep;
              return (
                <div key={index} className="relative z-10 flex flex-col items-center">
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${isCompleted ? 'bg-teal-600 text-white' : isActive ? 'bg-white border-2 border-teal-600 text-teal-600 shadow-md' : 'bg-white border-2 border-gray-300 text-gray-400'}`}>
                    {isCompleted ? <Icons.Check /> : (index + 1)}
                  </div>
                  <span className={`absolute top-10 w-28 text-center text-xs font-semibold ${isActive ? 'text-teal-700' : 'text-gray-500'}`}>{step}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const Toast = ({ message, type = 'success', onClose }) => {
      useEffect(() => {
        if (!message) return;
        const timer = setTimeout(onClose, 2400);
        return () => clearTimeout(timer);
      }, [message, onClose]);

      if (!message) return null;

      return (
        <div className="fixed bottom-8 right-8 z-50">
          <div className={`px-5 py-4 rounded-xl shadow-floating text-white font-semibold text-sm toast-animate ${type === 'error' ? 'bg-red-500' : 'bg-navy'}`}>
            {message}
          </div>
        </div>
      );
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
          <div className="absolute inset-0 bg-navy/40 backdrop-blur-sm" onClick={onClose}></div>
          <div className="bg-surface rounded-2xl shadow-floating w-full max-w-md z-10 overflow-hidden">
            <div className="flex justify-between items-center p-6 border-b border-gray-100">
              <h3 className="text-xl font-bold text-gray-900">{title}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-full p-2 transition"><Icons.X /></button>
            </div>
            <div className="p-6">{children}</div>
          </div>
        </div>
      );
    };

    const App = () => {
      const maHopDong = useMemo(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get('maHopDong') || 'HD-2025-099';
      }, []);

      const activeTab = 'contract';
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [toast, setToast] = useState({ message: '', type: 'success' });
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [data, setData] = useState({
        soNguoiToiDa: 0,
        soLuongHienTai: 0,
        daiDienId: null,
        danhSach: []
      });
      const [form, setForm] = useState({ hoTen: '', soDienThoai: '', cccd: '' });

      const showToast = (message, type = 'success') => setToast({ message, type });

      const fetchMembers = async () => {
        setLoading(true);
        try {
          const res = await fetch(`/api/hop-dong/${encodeURIComponent(maHopDong)}/thanh-vien`);
          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.error || 'Lỗi tải thành viên');
          setData(json.data);
        } catch (error) {
          showToast(error.message || 'Lỗi tải thành viên', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchMembers();
      }, [maHopDong]);

      const onSaveMember = async (e) => {
        e.preventDefault();
        if (saving) return;

        setSaving(true);
        try {
          const res = await fetch(`/api/hop-dong/${encodeURIComponent(maHopDong)}/thanh-vien`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              hoTen: form.hoTen,
              soDienThoai: form.soDienThoai,
              cccd: form.cccd
            })
          });

          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.error || 'Không thể lưu thành viên');

          setIsModalOpen(false);
          setForm({ hoTen: '', soDienThoai: '', cccd: '' });
          showToast('Đã thêm thành viên');
          await fetchMembers();
        } catch (error) {
          showToast(error.message || 'Không thể lưu thành viên', 'error');
        } finally {
          setSaving(false);
        }
      };

      const onDeleteMember = async (maKhachHang, hoTen) => {
        if (!window.confirm(`Xóa ${hoTen} khỏi hợp đồng?`)) return;

        try {
          const res = await fetch(
            `/api/hop-dong/${encodeURIComponent(maHopDong)}/thanh-vien/${encodeURIComponent(maKhachHang)}`,
            { method: 'DELETE' }
          );
          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.error || 'Không thể xóa thành viên');

          showToast('Đã xóa thành viên');
          await fetchMembers();
        } catch (error) {
          showToast(error.message || 'Không thể xóa thành viên', 'error');
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-surface border-b border-gray-100 sticky top-0 z-40 h-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between">
              <div className="flex items-center cursor-default">
                <div className="w-10 h-10 bg-teal-600 rounded-xl text-white flex items-center justify-center font-bold text-xl mr-3 shadow-md">H</div>
                <span className="font-extrabold text-2xl text-gray-900 tracking-tight hidden sm:block">HomeStay<span className="text-teal-600">.</span></span>
              </div>

              <nav className="hidden md:flex space-x-1 border border-gray-200 rounded-full p-1 shadow-sm bg-white">
                <button className="px-5 py-2 rounded-full text-sm font-bold text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">Tìm phòng</button>
                <button className="px-5 py-2 rounded-full text-sm font-bold text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">Lịch hẹn</button>
                <button className="px-5 py-2 rounded-full text-sm font-bold bg-gray-100 text-gray-900 shadow-sm">My Rent</button>
              </nav>

              <div className="flex items-center space-x-4">
                <button className="text-gray-500 hover:text-gray-900 transition hidden sm:block font-bold text-sm flex items-center"><Icons.Globe/><span className="ml-1 uppercase">VN</span></button>
                <button className="text-gray-500 hover:text-gray-900 transition relative p-2">
                  <Icons.Bell />
                  <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-coral rounded-full border-2 border-white"></span>
                </button>
                <button className="flex items-center cursor-pointer pl-1 pr-4 py-1 rounded-full border border-gray-200 hover:shadow-md transition bg-white gap-2">
                  <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden border border-gray-200">
                    <img src="https://i.pravatar.cc/150?img=11" className="w-full h-full object-cover" />
                  </div>
                  <span className="text-sm font-extrabold text-gray-900 hidden sm:block">Khách</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-grow bg-surface min-h-screen">
            <div className="bg-white border-b border-gray-100 pb-6"><Stepper currentStep={2} /></div>

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col md:flex-row gap-10">
              <div className="w-full md:w-64 flex-shrink-0">
                <div className="bg-white rounded-3xl p-4 sticky top-28 shadow-soft border border-gray-100">
                  <div className="mb-6 p-4 bg-teal-50 rounded-2xl flex items-center">
                    <div className="w-3 h-3 bg-teal-500 rounded-full mr-3 animate-pulse"></div>
                    <span className="font-bold text-teal-800 text-sm">Đang lưu trú</span>
                  </div>
                  <nav className="space-y-2">
                    {[
                      { id: 'contract', label: 'Hợp đồng & Cư dân', icon: <Icons.UserPlus /> },
                      { id: 'billing', label: 'Hóa đơn & Thanh toán', icon: <Icons.FileText /> },
                      { id: 'settlement', label: 'Trả phòng & Hoàn cọc', icon: <Icons.CreditCard /> }
                    ].map(tab => (
                      <button
                        key={tab.id}
                        className={`w-full flex items-center px-4 py-3.5 text-sm font-bold rounded-2xl transition-all ${activeTab === tab.id ? 'bg-gray-900 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}
                      >
                        <span className="mr-3">{tab.icon}</span>{tab.label}
                      </button>
                    ))}
                  </nav>
                </div>
              </div>

              <div className="flex-1 bg-white rounded-3xl shadow-soft border border-gray-100 p-8 md:p-12 overflow-hidden">
                <div className="animate-fade-in">
                  <div className="mb-12">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-extrabold text-gray-900">Thành viên phòng</h2>
                      <div className="flex items-center gap-3">
                        <span className="text-sm font-bold text-gray-500">{data.soLuongHienTai}/{data.soNguoiToiDa || 0} người</span>
                        <button onClick={() => setIsModalOpen(true)} className="text-teal-600 font-bold text-sm bg-teal-50 px-4 py-2 rounded-full hover:bg-teal-100 transition">+ Thêm thành viên</button>
                      </div>
                    </div>

                    {loading ? (
                      <div className="text-gray-500 font-semibold py-8">Đang tải thành viên...</div>
                    ) : (
                      <div className="space-y-4">
                        {data.danhSach.map((member) => {
                          const isOwner = member.maKhachHang === data.daiDienId || Number(member.daiDienNhom) === 1;
                          const initial = (member.hoTen || 'K').trim().charAt(0).toUpperCase();

                          return (
                            <div key={`${member.maHopDong}-${member.maKhachHang}`} className="border border-gray-200 rounded-2xl p-4 flex items-center bg-gray-50">
                              <div className="w-12 h-12 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold text-lg mr-4">{initial}</div>
                              <div className="min-w-0 flex-1">
                                <p className="font-bold text-gray-900 truncate">{member.hoTen}{isOwner ? ' (Bạn)' : ''}</p>
                                <p className="text-xs text-gray-500 font-medium">{isOwner ? 'Đại diện HĐ' : 'Thành viên'}</p>
                              </div>
                              {!isOwner && (
                                <button
                                  onClick={() => onDeleteMember(member.maKhachHang, member.hoTen)}
                                  className="text-gray-400 hover:text-red-600 p-2"
                                  title="Xóa thành viên"
                                >
                                  <Icons.Trash2 />
                                </button>
                              )}
                            </div>
                          );
                        })}

                        <button
                          onClick={() => setIsModalOpen(true)}
                          className="w-full border border-dashed border-gray-300 rounded-2xl p-5 flex items-center justify-center text-gray-400 font-bold hover:bg-gray-50 transition"
                        >
                          + Trống (Có thể thêm)
                        </button>
                      </div>
                    )}
                  </div>

                  <div>
                    <h2 className="text-xl font-extrabold text-gray-900 mb-6">Hợp đồng lưu trú</h2>
                    <div className="border border-gray-200 rounded-3xl overflow-hidden bg-gray-50 p-2 md:p-6 mb-6">
                      <div className="bg-white w-full shadow-sm border border-gray-200 overflow-y-auto p-8 h-[400px] pdf-viewer-fake text-sm text-gray-800 rounded-2xl">
                        <h2 className="text-center font-bold text-lg mb-6">HỢP ĐỒNG THUÊ CHỖ Ở LƯU TRÚ</h2>
                        <p className="font-bold mb-2">BÊN THUÊ (BÊN B): NGUYỄN VĂN KHÁCH</p>
                        <p className="mb-4">Số CCCD: 079123456789</p>
                        <p className="text-justify leading-relaxed">Điều 1: Bên A đồng ý cho Bên B thuê phòng Studio tại chi nhánh Quận 1 với giá 6.500.000đ/tháng. Thời hạn hợp đồng 12 tháng từ ngày 15/05/2026...</p>
                      </div>
                    </div>
                    <div className="bg-white border-2 border-teal-600 rounded-3xl p-6 shadow-sm">
                      <label className="flex items-start mb-6">
                        <input type="checkbox" className="mt-1 w-5 h-5 rounded text-teal-600 focus:ring-teal-500 border-gray-300" />
                        <span className="ml-3 text-gray-700 font-medium">Tôi đã đọc, hiểu rõ và đồng ý với tất cả các điều khoản trong Hợp đồng.</span>
                      </label>
                      <button onClick={(e) => e.preventDefault()} className="w-full md:w-auto float-right bg-gray-900 text-white font-extrabold py-4 px-10 rounded-2xl opacity-60 cursor-not-allowed">
                        Ký Hợp Đồng Điện Tử
                      </button>
                      <div className="clear-both"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} title="Thêm người ở ghép">
            <form className="space-y-5" onSubmit={onSaveMember}>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Họ và tên</label>
                <input
                  type="text"
                  value={form.hoTen}
                  onChange={(e) => setForm((prev) => ({ ...prev, hoTen: e.target.value }))}
                  className="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 outline-none focus:border-teal-500 focus:bg-white font-medium transition"
                  placeholder="Nguyễn Văn B"
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Số điện thoại</label>
                <input
                  type="tel"
                  value={form.soDienThoai}
                  onChange={(e) => setForm((prev) => ({ ...prev, soDienThoai: e.target.value }))}
                  className="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 outline-none focus:border-teal-500 focus:bg-white font-medium transition"
                  placeholder="0909..."
                />
              </div>
              <div>
                <label className="block text-sm font-bold text-gray-700 mb-2">Số CCCD</label>
                <input
                  type="text"
                  value={form.cccd}
                  onChange={(e) => setForm((prev) => ({ ...prev, cccd: e.target.value }))}
                  className="w-full border border-gray-200 bg-gray-50 rounded-xl p-3.5 outline-none focus:border-teal-500 focus:bg-white font-medium transition"
                  placeholder="123456789012"
                />
              </div>
              <button
                type="submit"
                disabled={saving}
                className="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-4 rounded-xl mt-4 transition shadow-md disabled:opacity-70"
              >
                {saving ? 'Đang lưu...' : 'Lưu thành viên'}
              </button>
            </form>
          </Modal>

          <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: 'success' })} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
