<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant ERP - Homestay Dorm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* UI Font: Inter | Number Font: Fira Code / Roboto Mono */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; /* Gray 100 */
            color: #1f2937; /* Gray 800 */
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Enforce Monospace for specific classes */
        .font-mono { font-family: 'Fira Code', monospace; font-variant-numeric: tabular-nums; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e5e7eb; }
        ::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* Invoice Paper Style */
        .invoice-paper {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e7eb;
        }

        /* Image Zoom Feature for Bills */
        .zoom-container { overflow: hidden; position: relative; border-radius: 0.5rem; }
        .zoom-img { transition: transform 0.3s ease; transform-origin: center; cursor: zoom-in; }
        .zoom-container:hover .zoom-img { transform: scale(1.5); }

        /* Simple Bar Chart CSS */
        .bar-container { display: flex; align-items: flex-end; height: 100%; gap: 12px; padding-top: 20px;}
        .bar-group { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .bars { display: flex; align-items: flex-end; gap: 4px; height: 150px; width: 100%; justify-content: center;}
        .bar-in { width: 16px; background-color: #16a34a; border-radius: 4px 4px 0 0; }
        .bar-out { width: 16px; background-color: #dc2626; border-radius: 4px 4px 0 0; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#1e3a8a', /* Deep Blue for Accountant Sidebar */
                        accent: '#2563eb', /* Blue CTA */
                        cashIn: '#16a34a', /* Green - Dòng tiền vào */
                        cashOut: '#dc2626', /* Red - Dòng tiền ra */
                        pending: '#f59e0b', /* Amber - Chờ xử lý */
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- UTILS & FORMATTERS ---
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('vi-VN').format(amount);
        };

        const numberToWords = (number) => {
            // Simplified mock function for UX hint
            if(number === 5000000) return "Năm triệu đồng chẵn";
            if(number === 3800000) return "Ba triệu tám trăm nghìn đồng";
            if(number === 2500000) return "Hai triệu năm trăm nghìn đồng";
            return "Đọc số tiền...";
        };

        // --- ICONS ---
        const Icons = {
            PieChart: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            CheckSquare: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            FileText: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            Calculator: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/></svg>,
            Download: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
            Calendar: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Copy: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        };

        // --- VIEWS ---

        // 1. DASHBOARD
        const DashboardView = () => {
            const chartData = [
                { label: 'Tuần 1', in: 120, out: 40 },
                { label: 'Tuần 2', in: 180, out: 30 },
                { label: 'Tuần 3', in: 90, out: 150 },
                { label: 'Tuần 4', in: 250, out: 60 },
            ];

            return (
                <div className="p-8 h-full overflow-y-auto">
                    <h1 className="text-2xl font-bold text-gray-800 mb-6">Báo cáo Tài chính - Tháng 05/2026</h1>

                    {/* Metric Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-t-4 border-t-cashIn">
                            <p className="text-sm font-semibold text-gray-500 uppercase">Tổng Thu (Thực tế)</p>
                            <h3 className="text-3xl font-mono font-bold text-gray-800 mt-2 text-right text-cashIn group" title={numberToWords(640000000)}>
                                {formatMoney(640000000)}<span className="text-lg text-gray-400">₫</span>
                            </h3>
                        </div>
                        <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-t-4 border-t-cashOut">
                            <p className="text-sm font-semibold text-gray-500 uppercase">Tổng Chi (Gồm Hoàn cọc)</p>
                            <h3 className="text-3xl font-mono font-bold text-gray-800 mt-2 text-right text-cashOut group" title={numberToWords(280000000)}>
                                {formatMoney(280000000)}<span className="text-lg text-gray-400">₫</span>
                            </h3>
                        </div>
                        <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-t-4 border-t-pending">
                            <p className="text-sm font-semibold text-gray-500 uppercase">Công nợ chờ thu</p>
                            <h3 className="text-3xl font-mono font-bold text-gray-800 mt-2 text-right text-pending">
                                {formatMoney(45500000)}<span className="text-lg text-gray-400">₫</span>
                            </h3>
                        </div>
                        <div className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-t-4 border-t-blue-500">
                            <p className="text-sm font-semibold text-gray-500 uppercase">Tiền cọc đang giữ</p>
                            <h3 className="text-3xl font-mono font-bold text-gray-800 mt-2 text-right">
                                {formatMoney(120000000)}<span className="text-lg text-gray-400">₫</span>
                            </h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* Chart */}
                        <div className="bg-white p-6 rounded-lg border border-gray-200 shadow-sm h-80 flex flex-col">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-gray-800">Dòng tiền (Triệu VNĐ)</h3>
                                <div className="flex gap-4 text-xs font-semibold">
                                    <span className="flex items-center"><div className="w-3 h-3 bg-cashIn mr-1"></div> Thu</span>
                                    <span className="flex items-center"><div className="w-3 h-3 bg-cashOut mr-1"></div> Chi</span>
                                </div>
                            </div>
                            <div className="flex-1 border-b border-l border-gray-200 bar-container">
                                {chartData.map((d, i) => (
                                    <div key={i} className="bar-group">
                                        <div className="bars">
                                            <div className="bar-in" style={{height: `${(d.in/300)*100}%`}} title={`Thu: ${d.in}M`}></div>
                                            <div className="bar-out" style={{height: `${(d.out/300)*100}%`}} title={`Chi: ${d.out}M`}></div>
                                        </div>
                                        <span className="text-xs text-gray-500 font-medium">{d.label}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* To-Do List */}
                        <div className="bg-white rounded-lg border border-gray-200 shadow-sm h-80 flex flex-col">
                            <div className="p-4 border-b border-gray-200 bg-gray-50 flex justify-between">
                                <h3 className="font-bold text-gray-800">Cần xử lý ngay (To-do)</h3>
                                <span className="bg-pending text-white text-xs font-bold px-2 py-1 rounded">3 khoản chờ duyệt</span>
                            </div>
                            <div className="flex-1 overflow-y-auto p-0">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-gray-50 text-gray-500 font-semibold sticky top-0">
                                        <tr><th className="p-3 border-b">Loại</th><th className="p-3 border-b">Khách hàng</th><th className="p-3 border-b text-right">Số tiền (₫)</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        <tr className="hover:bg-gray-50 cursor-pointer">
                                            <td className="p-3"><span className="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded">Cọc mới</span></td>
                                            <td className="p-3 text-gray-800 font-medium">Trần Văn Bằng</td>
                                            <td className="p-3 text-right font-mono font-bold text-cashIn">{formatMoney(5000000)}</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 cursor-pointer">
                                            <td className="p-3"><span className="text-xs font-bold bg-orange-100 text-orange-700 px-2 py-1 rounded">Tiền phòng</span></td>
                                            <td className="p-3 text-gray-800 font-medium">Lê Thị Cẩm</td>
                                            <td className="p-3 text-right font-mono font-bold text-cashIn">{formatMoney(2500000)}</td>
                                        </tr>
                                        <tr className="hover:bg-gray-50 cursor-pointer">
                                            <td className="p-3"><span className="text-xs font-bold bg-red-100 text-red-700 px-2 py-1 rounded">Hoàn cọc</span></td>
                                            <td className="p-3 text-gray-800 font-medium">Nguyễn Tuấn</td>
                                            <td className="p-3 text-right font-mono font-bold text-cashOut">{formatMoney(3800000)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. DEPOSIT APPROVAL (Split Screen)
        const DepositApprovalView = () => {
            const [selectedId, setSelectedId] = useState(1);
            const [rejectReason, setRejectReason] = useState('');

            const deposits = [
                { id: 1, txnCode: "DEP-0510", name: "Nguyễn Văn A", room: "P.201", amount: 5000000, time: "Còn 2h", status: 'pending', img: "https://images.unsplash.com/photo-1620714223084-8fcacc6dfd8d?w=400&q=80" },
                { id: 2, txnCode: "DEP-0511", name: "Lý Mạc Sầu", room: "P.305", amount: 3000000, time: "Còn 15h", status: 'pending', img: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=400&q=80" }
            ];

            const selected = deposits.find(d => d.id === selectedId);

            return (
                <div className="h-full flex flex-col">
                    <div className="flex-1 flex overflow-hidden">
                        {/* Left: Pending List */}
                        <div className="w-1/3 min-w-[350px] bg-white border-r border-gray-200 flex flex-col">
                            <div className="p-4 border-b border-gray-200 bg-gray-50">
                                <h2 className="font-bold text-gray-800">Cọc chờ xác nhận (Từ Sale)</h2>
                            </div>
                            <div className="flex-1 overflow-y-auto divide-y divide-gray-100">
                                {deposits.map(d => (
                                    <div key={d.id} 
                                        onClick={() => {setSelectedId(d.id); setRejectReason('');}}
                                        className={`p-4 cursor-pointer transition border-l-4 ${selectedId === d.id ? 'bg-blue-50 border-l-accent' : 'hover:bg-gray-50 border-l-transparent'}`}
                                    >
                                        <div className="flex justify-between mb-1">
                                            <span className="font-bold text-gray-800">{d.name}</span>
                                            <span className="text-xs font-semibold text-red-600 bg-red-50 px-2 py-0.5 rounded">{d.time}</span>
                                        </div>
                                        <div className="flex justify-between items-end">
                                            <div className="text-xs text-gray-500">Mã: {d.txnCode} • {d.room}</div>
                                            <div className="font-mono font-bold text-cashIn">{formatMoney(d.amount)}₫</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Right: Verification Area */}
                        <div className="flex-1 bg-gray-100 p-6 flex flex-col overflow-y-auto">
                            {selected && (
                                <div className="max-w-3xl mx-auto w-full">
                                    <div className="bg-white rounded-lg border border-gray-200 shadow-sm p-6 mb-6">
                                        <h2 className="text-xl font-bold text-gray-800 border-b border-gray-200 pb-4 mb-4">Đối chứng giao dịch: {selected.txnCode}</h2>
                                        
                                        <div className="grid grid-cols-2 gap-8">
                                            {/* Data from System */}
                                            <div>
                                                <h3 className="text-sm font-bold text-gray-500 uppercase mb-3">Yêu cầu từ Hệ thống</h3>
                                                <table className="w-full text-sm">
                                                    <tbody>
                                                        <tr className="border-b border-gray-100"><td className="py-2 text-gray-500">Khách hàng</td><td className="py-2 text-right font-medium">{selected.name}</td></tr>
                                                        <tr className="border-b border-gray-100"><td className="py-2 text-gray-500">Phòng</td><td className="py-2 text-right font-medium">{selected.room}</td></tr>
                                                        <tr className="border-b border-gray-100"><td className="py-2 text-gray-500">Nội dung CK chuẩn</td><td className="py-2 text-right font-mono font-bold text-brand">{selected.txnCode}</td></tr>
                                                        <tr><td className="py-2 text-gray-500">Số tiền phải thu</td><td className="py-2 text-right font-mono font-bold text-2xl text-cashIn">{formatMoney(selected.amount)}₫</td></tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            {/* Image from User */}
                                            <div>
                                                <h3 className="text-sm font-bold text-gray-500 uppercase mb-3">Ủy nhiệm chi (Khách tải lên)</h3>
                                                <div className="border border-gray-300 p-1 rounded-lg bg-gray-50 zoom-container h-48 flex items-center justify-center">
                                                    <img src={selected.img} alt="Bill" className="zoom-img max-h-full max-w-full object-contain" />
                                                </div>
                                                <p className="text-xs text-center text-gray-400 mt-2">Rê chuột vào ảnh để phóng to soi mã GD</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div className="flex gap-4">
                                        <div className="flex-1 bg-white border border-red-200 rounded-lg p-4 shadow-sm">
                                            <input type="text" placeholder="Ghi chú lỗi (VD: Chuyển thiếu 500k, sai nội dung...)" value={rejectReason} onChange={e=>setRejectReason(e.target.value)} className="w-full border border-gray-300 rounded p-2 text-sm mb-3 focus:outline-none focus:border-red-500" />
                                            <button onClick={()=>alert(`Từ chối với lý do: ${rejectReason}`)} disabled={!rejectReason} className="w-full py-2 bg-white border border-red-500 text-red-600 font-bold rounded hover:bg-red-50 transition disabled:opacity-50">Từ chối / Báo Lỗi</button>
                                        </div>
                                        <div className="flex-1">
                                            <button onClick={()=>alert('Đã xác nhận tiền vào tài khoản!')} className="w-full h-full bg-cashIn hover:bg-green-700 text-white font-bold text-lg rounded-lg shadow-md transition transform hover:-translate-y-1">
                                                ✅ Xác nhận Tiền đã vào TK
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. INVOICE BUILDER
        const InvoiceBuilderView = () => {
            const [items, setItems] = useState([
                { id: 1, name: "Tiền thuê phòng P.201 (Tháng 5)", qty: 1, price: 2500000 },
                { id: 2, name: "Phí quản lý chung", qty: 1, price: 150000 },
                { id: 3, name: "Tiền điện (Thu khoán)", qty: 1, price: 200000 }
            ]);

            const addItem = () => setItems([...items, { id: Date.now(), name: "", qty: 1, price: 0 }]);
            const updateItem = (id, field, value) => setItems(items.map(i => i.id === id ? { ...i, [field]: value } : i));
            const removeItem = (id) => setItems(items.filter(i => i.id !== id));

            const total = items.reduce((sum, item) => sum + (item.qty * item.price), 0);

            return (
                <div className="h-full bg-gray-100 flex flex-col p-6 overflow-y-auto items-center">
                    <div className="w-full max-w-4xl invoice-paper p-10 relative">
                        {/* Header */}
                        <div className="flex justify-between items-start border-b-2 border-gray-800 pb-6 mb-8">
                            <div>
                                <h1 className="text-3xl font-black text-gray-800 tracking-tight">HÓA ĐƠN YÊU CẦU THANH TOÁN</h1>
                                <p className="text-sm font-mono text-gray-500 mt-2">Mã HĐ: INV-2026-0510-01</p>
                            </div>
                            <div className="text-right">
                                <span className="bg-pending text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Chờ thanh toán</span>
                                <div className="mt-4 text-sm text-gray-600">
                                    <p>Khách hàng: <strong>Nguyễn Văn A</strong></p>
                                    <p>Phòng: <strong>P.201</strong></p>
                                    <p>Kỳ thu: <strong>05/2026</strong></p>
                                </div>
                            </div>
                        </div>

                        {/* Line Items */}
                        <table className="w-full text-sm mb-6">
                            <thead className="bg-gray-800 text-white">
                                <tr>
                                    <th className="p-3 text-left w-1/2">Diễn giải / Khoản thu</th>
                                    <th className="p-3 text-center w-16">SL</th>
                                    <th className="p-3 text-right">Đơn giá (₫)</th>
                                    <th className="p-3 text-right">Thành tiền (₫)</th>
                                    <th className="p-3 w-10"></th>
                                </tr>
                            </thead>
                            <tbody>
                                {items.map(item => (
                                    <tr key={item.id} className="border-b border-gray-200">
                                        <td className="p-2"><input type="text" value={item.name} onChange={(e)=>updateItem(item.id, 'name', e.target.value)} className="w-full border border-transparent hover:border-gray-300 focus:border-blue-500 rounded px-2 py-1 outline-none" placeholder="Tên khoản thu"/></td>
                                        <td className="p-2 text-center font-mono"><input type="number" value={item.qty} onChange={(e)=>updateItem(item.id, 'qty', Number(e.target.value))} className="w-full text-center border border-transparent hover:border-gray-300 focus:border-blue-500 rounded px-1 py-1 outline-none"/></td>
                                        <td className="p-2 text-right font-mono"><input type="number" value={item.price} onChange={(e)=>updateItem(item.id, 'price', Number(e.target.value))} className="w-full text-right border border-transparent hover:border-gray-300 focus:border-blue-500 rounded px-2 py-1 outline-none"/></td>
                                        <td className="p-2 text-right font-mono font-bold text-gray-800">{formatMoney(item.qty * item.price)}</td>
                                        <td className="p-2 text-center"><button onClick={()=>removeItem(item.id)} className="text-gray-400 hover:text-red-600"><Icons.Trash/></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>

                        <button onClick={addItem} className="text-sm font-bold text-accent flex items-center hover:underline mb-8"><Icons.Plus/><span className="ml-1">Thêm dòng</span></button>

                        {/* Sticky Total Area */}
                        <div className="sticky bottom-0 bg-white border-t-2 border-gray-800 pt-6 pb-2 flex justify-between items-end mt-12">
                            <div className="text-sm text-gray-500">
                                <p>Tài khoản thụ hưởng: <strong>1903456789 (VCB)</strong></p>
                                <p>Cú pháp CK: <strong>INV2026 P201 NVA</strong></p>
                            </div>
                            <div className="text-right">
                                <p className="text-sm font-bold text-gray-500 uppercase tracking-widest mb-1">Tổng Cộng Cần Thu</p>
                                <p className="text-4xl font-mono font-black text-brand">{formatMoney(total)} ₫</p>
                            </div>
                        </div>
                    </div>

                    <div className="w-full max-w-4xl mt-6 flex justify-end">
                        <button className="bg-accent hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition">Phát hành & Gửi Email thanh toán</button>
                    </div>
                </div>
            );
        };

        // 4. SETTLEMENT CALCULATOR (Hoàn Cọc)
        const SettlementView = () => {
            const [deposit, setDeposit] = useState(5000000);
            const [ratio, setRatio] = useState(1); // 100%
            
            const [deductions, setDeductions] = useState([
                { id: 1, name: "Phí đền bù (Bể khay tủ lạnh) - Từ Quản lý", amount: 500000, readOnly: true },
                { id: 2, name: "Tiền điện tháng cuối (25 Kwh x 3.5k)", amount: 87500, readOnly: false }
            ]);

            const addDeduction = () => setDeductions([...deductions, { id: Date.now(), name: "", amount: 0, readOnly: false }]);
            const updateDeduct = (id, field, value) => setDeductions(deductions.map(d => d.id === id ? { ...d, [field]: value } : d));
            const removeDeduct = (id) => setDeductions(deductions.filter(d => d.id !== id));

            const totalRefundAllowed = deposit * ratio;
            const totalDeductions = deductions.reduce((sum, d) => sum + Number(d.amount), 0);
            const bottomLine = totalRefundAllowed - totalDeductions;
            const isRefunding = bottomLine >= 0;

            return (
                <div className="h-full bg-gray-100 flex flex-col p-6 overflow-y-auto items-center">
                    <div className="w-full max-w-4xl bg-white rounded-lg shadow-sm border border-gray-200 p-8">
                        <h2 className="text-2xl font-bold text-gray-800 border-b border-gray-200 pb-4 mb-6">Bảng Đối Soát & Thanh Lý Hợp Đồng</h2>
                        
                        <div className="grid grid-cols-2 gap-8 mb-8">
                            {/* Khối 1: Tiền cọc */}
                            <div className="bg-gray-50 border border-gray-200 p-5 rounded-lg">
                                <h3 className="font-bold text-gray-700 mb-4 uppercase text-xs tracking-wider">Khối 1: Xác định Tiền Cọc</h3>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-sm font-medium text-gray-600">Tiền cọc ban đầu</span>
                                        <span className="font-mono font-bold text-lg text-gray-800">{formatMoney(deposit)} ₫</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-sm font-medium text-gray-600">Tỷ lệ hoàn (Lý do trả)</span>
                                        <select value={ratio} onChange={e=>setRatio(Number(e.target.value))} className="border border-gray-300 rounded px-2 py-1 outline-none text-sm font-medium bg-white">
                                            <option value={1}>100% (Hết hạn HĐ)</option>
                                            <option value={0.5}>50% (Trả trước hạn có báo)</option>
                                            <option value={0}>0% (Phá HĐ)</option>
                                        </select>
                                    </div>
                                    <div className="pt-3 border-t border-gray-200 flex justify-between items-center">
                                        <span className="font-bold text-gray-800">Cọc được phép hoàn</span>
                                        <span className="font-mono font-bold text-xl text-cashIn">{formatMoney(totalRefundAllowed)} ₫</span>
                                    </div>
                                </div>
                            </div>

                            {/* Khối 2: Khấu trừ */}
                            <div className="bg-red-50 border border-red-100 p-5 rounded-lg">
                                <h3 className="font-bold text-red-800 mb-4 uppercase text-xs tracking-wider">Khối 2: Khấu trừ phát sinh (-)</h3>
                                <table className="w-full text-sm mb-2">
                                    <tbody>
                                        {deductions.map(d => (
                                            <tr key={d.id} className="border-b border-red-100/50">
                                                <td className="py-1">
                                                    <input type="text" value={d.name} readOnly={d.readOnly} onChange={e=>updateDeduct(d.id, 'name', e.target.value)} className={`w-full bg-transparent border-none outline-none text-red-900 ${d.readOnly ? 'opacity-80 cursor-not-allowed font-medium' : ''}`} placeholder="Nhập tên chi phí..."/>
                                                </td>
                                                <td className="py-1 text-right font-mono text-red-700">
                                                    -<input type="number" value={d.amount} readOnly={d.readOnly} onChange={e=>updateDeduct(d.id, 'amount', Number(e.target.value))} className="w-24 bg-transparent border-b border-red-200 outline-none text-right font-bold"/>
                                                </td>
                                                <td className="w-6 text-right">
                                                    {!d.readOnly && <button onClick={()=>removeDeduct(d.id)} className="text-red-400 hover:text-red-700"><Icons.Trash/></button>}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <button onClick={addDeduction} className="text-xs font-bold text-red-600 hover:underline flex items-center"><Icons.Plus/><span className="ml-1">Thêm phí thủ công</span></button>
                                <div className="mt-3 text-right font-mono font-bold text-cashOut">Tổng trừ: -{formatMoney(totalDeductions)} ₫</div>
                            </div>
                        </div>

                        {/* Khối 3: Result */}
                        <div className={`border-2 rounded-xl p-6 ${isRefunding ? 'border-cashIn bg-green-50' : 'border-cashOut bg-red-50'}`}>
                            <h3 className="font-bold uppercase text-xs tracking-wider mb-2 opacity-70">Khối 3: Kết quả Cuối Cùng</h3>
                            <div className="flex justify-between items-end">
                                <div className="text-lg font-bold text-gray-800">
                                    {isRefunding ? "Số tiền CẦN CHUYỂN TRẢ cho Khách:" : "Số tiền KHÁCH CẦN ĐÓNG THÊM:"}
                                </div>
                                <div className={`text-5xl font-mono font-black ${isRefunding ? 'text-cashIn' : 'text-cashOut'}`}>
                                    {formatMoney(Math.abs(bottomLine))} ₫
                                </div>
                            </div>
                            
                            {isRefunding && (
                                <div className="mt-6 flex items-center bg-white p-3 border border-green-200 rounded-lg max-w-md">
                                    <div className="flex-1 text-sm">
                                        <p className="text-gray-500 text-xs">Thông tin nhận tiền của khách (Từ Portal)</p>
                                        <p className="font-bold text-gray-800 font-mono mt-1">1903456789 - VCB - NGUYEN VAN A</p>
                                    </div>
                                    <button className="text-gray-400 hover:text-brand p-2 bg-gray-50 rounded border border-gray-200" title="Copy STK"><Icons.Copy/></button>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    {/* Sticky Footer Action */}
                    <div className="w-full max-w-4xl mt-6 flex justify-end gap-4 sticky bottom-6">
                        <button className="px-6 py-3 border border-gray-300 text-gray-700 font-bold rounded-lg bg-white shadow-sm hover:bg-gray-50">In Biên bản</button>
                        {isRefunding ? (
                            <button className="bg-cashIn hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition">Tạo Phiếu Chi & Xác nhận đã chuyển khoản</button>
                        ) : (
                            <button className="bg-cashOut hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition">Gửi Thông báo Đòi nợ qua Email/Zalo</button>
                        )}
                    </div>
                </div>
            );
        };

        // --- APP SHELL ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');

            const menuItems = [
                { id: 'dashboard', label: 'Tổng quan Tài chính', icon: <Icons.PieChart /> },
                { id: 'deposit', label: 'Duyệt Tiền Cọc', icon: <Icons.CheckSquare /> },
                { id: 'invoice', label: 'Hóa đơn & Thu tiền', icon: <Icons.FileText /> },
                { id: 'settlement', label: 'Đối soát & Hoàn cọc', icon: <Icons.Calculator /> },
            ];

            return (
                <div className="flex h-screen w-full bg-gray-100 overflow-hidden">
                    {/* Left Sidebar */}
                    <aside className="w-64 bg-brand text-gray-300 flex flex-col flex-shrink-0">
                        <div className="h-16 flex items-center px-6 bg-blue-900/50 border-b border-blue-900/30">
                            <div className="w-8 h-8 bg-white rounded text-brand flex items-center justify-center font-bold text-xl mr-3 shadow-sm">H</div>
                            <span className="font-bold text-lg text-white tracking-wide">Dorm<span className="text-blue-300">Finance</span></span>
                        </div>
                        
                        <nav className="flex-1 py-6 px-3 space-y-1">
                            {menuItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center px-3 py-3 rounded-lg text-sm font-semibold transition-colors ${
                                        activeTab === item.id 
                                        ? 'bg-blue-600/50 text-white border-l-4 border-white' 
                                        : 'hover:bg-blue-800/30 hover:text-white border-l-4 border-transparent'
                                    }`}
                                >
                                    <span className="mr-3 opacity-90">{item.icon}</span>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        
                        <div className="p-4 bg-blue-900/50 border-t border-blue-900/30">
                            <div className="flex items-center">
                                <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center font-bold text-white border border-white/20">KT</div>
                                <div className="ml-3">
                                    <p className="text-sm font-bold text-white leading-tight">Phòng Kế Toán</p>
                                    <p className="text-xs text-blue-300 font-mono">ID: ACC-01</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col overflow-hidden min-w-0">
                        {/* Top Header */}
                        <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-10 shrink-0 shadow-sm">
                            <div className="flex items-center gap-6 flex-1">
                                {/* Global Search */}
                                <div className="relative max-w-sm w-full">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                        <Icons.Search />
                                    </div>
                                    <input 
                                        type="text" 
                                        className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-accent focus:border-accent text-sm transition" 
                                        placeholder="Tìm mã GD (Txn), số TK, tên khách..." 
                                    />
                                </div>

                                {/* Date Picker Mock */}
                                <div className="flex items-center border border-gray-300 rounded-md bg-white px-3 py-1.5 cursor-pointer hover:bg-gray-50 text-sm font-medium text-gray-700 shadow-sm">
                                    <span className="text-gray-400 mr-2"><Icons.Calendar/></span>
                                    Tháng này: 01/05 - 31/05/2026
                                </div>
                            </div>
                            
                            <div className="ml-4 flex items-center gap-3">
                                {/* Export Button */}
                                <button className="flex items-center gap-2 bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-md text-sm font-bold hover:bg-gray-50 shadow-sm transition">
                                    <Icons.Download/> Xuất Excel
                                </button>
                            </div>
                        </header>

                        {/* Views Router */}
                        <main className="flex-1 overflow-hidden relative">
                            {activeTab === 'dashboard' && <DashboardView />}
                            {activeTab === 'deposit' && <DepositApprovalView />}
                            {activeTab === 'invoice' && <InvoiceBuilderView />}
                            {activeTab === 'settlement' && <SettlementView />}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
