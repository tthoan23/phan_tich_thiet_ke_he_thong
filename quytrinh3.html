<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homestay Dorm - Nơi sống lý tưởng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Modern Sans-serif Font */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FAFAFA; /* Off-white / Trắng kem siêu nhạt */
            color: #111827; /* Gray 900 */
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Hide scrollbar for bento box but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .drag-drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
            background: #ffffff;
        }
        .drag-drop-zone:hover, .drag-drop-zone.active {
            border-color: #0f766e; /* Teal 700 */
            background-color: #f0fdfa; /* Teal 50 */
        }
        
        .pdf-viewer-fake {
            background-image: repeating-linear-gradient(#ffffff 0px, #ffffff 30px, #f8fafc 31px);
            line-height: 31px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        /* Toast Animation */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate { animation: slideInRight 0.3s ease-out forwards; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0f172a',
                        teal: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' },
                        coral: '#ff6b6b', /* Coral / Accent CTA */
                        surface: '#ffffff',
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'floating': '0 20px 40px -15px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Lucide Style) ---
        const Icons = {
            Search: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            Bell: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
            Globe: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            Heart: ({ filled }) => <svg width="20" height="20" viewBox="0 0 24 24" fill={filled ? "#ff6b6b" : "none"} stroke={filled ? "#ff6b6b" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            MapPin: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            UploadCloud: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Clock: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            FileText: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            UserPlus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
            CreditCard: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Home: () => <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            ShieldCheck: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        };

        // --- SHARED COMPONENTS ---
        const formatMoney = (amount) => new Intl.NumberFormat('vi-VN').format(amount);

        const Stepper = ({ currentStep }) => {
            const steps = ["Đặt cọc", "Cập nhật Hồ sơ", "Ký Hợp đồng", "Nhận phòng"];
            return (
                <div className="w-full max-w-3xl mx-auto mb-10 pt-8">
                    <div className="flex justify-between items-center relative">
                        <div className="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 z-0 rounded-full"></div>
                        <div className="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-teal-600 z-0 transition-all duration-500 rounded-full" style={{ width: `${(currentStep / (steps.length - 1)) * 100}%` }}></div>
                        
                        {steps.map((step, index) => {
                            const isCompleted = index < currentStep;
                            const isActive = index === currentStep;
                            return (
                                <div key={index} className="relative z-10 flex flex-col items-center">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-300 ${
                                        isCompleted ? 'bg-teal-600 text-white' : 
                                        isActive ? 'bg-white border-2 border-teal-600 text-teal-600 shadow-md' : 
                                        'bg-white border-2 border-gray-300 text-gray-400'
                                    }`}>
                                        {isCompleted ? <Icons.Check /> : (index + 1)}
                                    </div>
                                    <span className={`absolute top-10 w-28 text-center text-xs font-semibold ${isActive ? 'text-teal-700' : 'text-gray-500'}`}>{step}</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Toast = ({ message, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className="fixed bottom-8 right-8 z-50 bg-navy text-white px-6 py-4 rounded-xl shadow-floating toast-animate flex items-center gap-3">
                    <div className="w-6 h-6 bg-teal-500 rounded-full flex items-center justify-center text-white"><Icons.Check/></div>
                    <span className="font-medium text-sm">{message}</span>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
                    <div className="absolute inset-0 bg-navy/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-surface rounded-2xl shadow-floating w-full max-w-md z-10 overflow-hidden transform transition-all">
                        <div className="flex justify-between items-center p-6 border-b border-gray-100">
                            <h3 className="text-xl font-bold text-gray-900">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 rounded-full p-2 transition"><Icons.X /></button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        // --- VIEWS ---

        // 1. HOME VIEW (AIRBNB STYLE)
        const HomeView = ({ navigate }) => {
            const [favs, setFavs] = useState({});
            const toggleFav = (e, id) => { e.stopPropagation(); setFavs(prev => ({...prev, [id]: !prev[id]})); };

            const rooms = [
                { id: 1, name: "Studio Nguyên Căn Cao Cấp Ánh Sáng Tự Nhiên", area: "Quận 1, TP.HCM", price: 6500000, img: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80", type: "Nguyên phòng" },
                { id: 2, name: "Giường Ghép Dorm Premium - Tầng 3", area: "Bình Thạnh, TP.HCM", price: 2500000, img: "https://images.unsplash.com/photo-1555854877-bab0e564b8d5?auto=format&fit=crop&w=800&q=80", type: "Giường ghép" },
                { id: 3, name: "Phòng Standard 2 Người Ban Công Thoáng", area: "Quận 10, TP.HCM", price: 4000000, img: "https://images.unsplash.com/photo-1502672260266-1c1de2d93688?auto=format&fit=crop&w=800&q=80", type: "Phòng đôi" },
                { id: 4, name: "Dorm Nữ Yên Tĩnh Sạch Sẽ", area: "Quận 7, TP.HCM", price: 2000000, img: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80", type: "Giường ghép" },
            ];

            return (
                <div className="animate-fade-in pb-20">
                    {/* Hero & Floating Search */}
                    <div className="relative h-[500px] flex items-center justify-center bg-gray-900">
                        <img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb?auto=format&fit=crop&w=1920&q=80" alt="Hero" className="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-overlay" />
                        
                        <div className="relative z-10 w-full max-w-5xl px-4 flex flex-col items-center mt-10">
                            <h1 className="text-4xl md:text-6xl font-extrabold text-white mb-10 tracking-tight text-center drop-shadow-lg">Tìm không gian thuộc về bạn.</h1>
                            
                            {/* Floating Search Bar */}
                            <div className="bg-surface p-2 rounded-full shadow-floating flex flex-col md:flex-row items-center justify-between w-full max-w-4xl transform transition duration-300 hover:shadow-2xl">
                                <div className="flex-1 w-full px-8 py-3 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 rounded-l-full cursor-pointer transition">
                                    <label className="block text-xs font-bold text-gray-800 tracking-wide">Chi nhánh / Khu vực</label>
                                    <input type="text" placeholder="Tìm kiếm điểm đến" className="w-full outline-none text-gray-600 bg-transparent mt-1 text-sm placeholder-gray-400 font-medium" />
                                </div>
                                <div className="flex-1 w-full px-8 py-3 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 cursor-pointer transition">
                                    <label className="block text-xs font-bold text-gray-800 tracking-wide">Loại phòng</label>
                                    <select className="w-full outline-none text-gray-600 bg-transparent mt-1 text-sm font-medium cursor-pointer appearance-none">
                                        <option>Thêm loại phòng</option>
                                        <option>Giường ghép (Dorm)</option>
                                        <option>Nguyên phòng</option>
                                    </select>
                                </div>
                                <div className="flex-1 w-full px-8 py-3 hover:bg-gray-50 cursor-pointer transition">
                                    <label className="block text-xs font-bold text-gray-800 tracking-wide">Khoảng giá</label>
                                    <select className="w-full outline-none text-gray-600 bg-transparent mt-1 text-sm font-medium cursor-pointer appearance-none">
                                        <option>Bất kỳ</option>
                                        <option>Dưới 2 Triệu</option>
                                        <option>2 - 5 Triệu</option>
                                    </select>
                                </div>
                                <button className="w-full md:w-auto mt-2 md:mt-0 bg-coral hover:bg-red-500 text-white p-4 md:px-8 md:py-4 rounded-full font-bold transition-all flex items-center justify-center md:ml-2 shadow-lg">
                                    <Icons.Search /> <span className="ml-2 md:hidden">Tìm kiếm</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Room Grid */}
                    <div className="max-w-7xl mx-auto px-6 lg:px-8 py-16">
                        <h2 className="text-2xl font-bold text-gray-900 mb-8">Chỗ ở nổi bật</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {rooms.map(room => (
                                <div key={room.id} className="group cursor-pointer flex flex-col" onClick={() => navigate('detail')}>
                                    <div className="relative aspect-[4/3] overflow-hidden rounded-2xl mb-4">
                                        <img src={room.img} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out" />
                                        <button onClick={(e) => toggleFav(e, room.id)} className="absolute top-3 right-3 p-2 transition transform active:scale-90">
                                            <Icons.Heart filled={favs[room.id]} />
                                        </button>
                                        <div className="absolute top-3 left-3 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-md text-xs font-bold shadow-sm">
                                            {room.type}
                                        </div>
                                    </div>
                                    <div className="flex flex-col flex-1">
                                        <h3 className="text-base font-bold text-gray-900 line-clamp-1 group-hover:text-teal-700 transition">{room.name}</h3>
                                        <p className="text-sm text-gray-500 mt-1 mb-2 font-medium">{room.area}</p>
                                        <div className="mt-auto pt-2">
                                            <span className="text-lg font-bold text-gray-900">{formatMoney(room.price)}₫</span>
                                            <span className="text-sm text-gray-500 font-medium"> / tháng</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. ROOM DETAIL VIEW (BENTO BOX + 70/30)
        const RoomDetailView = ({ navigate }) => {
            return (
                <div className="bg-surface min-h-screen pb-24 animate-fade-in">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
                        <h1 className="text-3xl font-extrabold text-gray-900 mb-6 tracking-tight">Studio Nguyên Căn Cao Cấp Ánh Sáng Tự Nhiên</h1>
                        
                        {/* Bento Box Image Grid */}
                        <div className="grid grid-cols-4 grid-rows-2 gap-2 md:gap-3 h-[400px] md:h-[500px] rounded-3xl overflow-hidden mb-12">
                            <div className="col-span-4 md:col-span-2 row-span-2 relative group cursor-pointer">
                                <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80" className="w-full h-full object-cover group-hover:brightness-95 transition" />
                            </div>
                            <div className="hidden md:block relative group cursor-pointer">
                                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=600&q=80" className="w-full h-full object-cover group-hover:brightness-95 transition" />
                            </div>
                            <div className="hidden md:block relative group cursor-pointer">
                                <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=600&q=80" className="w-full h-full object-cover group-hover:brightness-95 transition" />
                            </div>
                            <div className="hidden md:block relative group cursor-pointer">
                                <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80" className="w-full h-full object-cover group-hover:brightness-95 transition" />
                            </div>
                            <div className="hidden md:block relative group cursor-pointer">
                                <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=600&q=80" className="w-full h-full object-cover group-hover:brightness-95 transition" />
                            </div>
                        </div>

                        {/* 70/30 Layout */}
                        <div className="flex flex-col lg:flex-row gap-16 relative">
                            {/* Left Col (70%) */}
                            <div className="lg:w-2/3">
                                <div className="flex items-center justify-between pb-8 border-b border-gray-200">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-900 mb-2">Toàn bộ căn hộ dịch vụ dành cho 2 người</h2>
                                        <p className="text-gray-600 font-medium">1 Phòng ngủ • 1 Phòng tắm riêng • Bếp riêng</p>
                                    </div>
                                    <div className="h-14 w-14 rounded-full bg-gray-100 flex items-center justify-center shadow-inner overflow-hidden border border-gray-200">
                                        <img src="https://i.pravatar.cc/100?img=1" className="w-full h-full object-cover" />
                                    </div>
                                </div>

                                <div className="py-8 border-b border-gray-200">
                                    <div className="flex items-start mb-6">
                                        <div className="mt-1 mr-4 text-gray-800"><Icons.ShieldCheck /></div>
                                        <div>
                                            <h3 className="font-bold text-gray-900 mb-1">Khu vực an ninh cao</h3>
                                            <p className="text-sm text-gray-500 font-medium">Bảo vệ 24/7, thẻ từ thang máy và khóa cửa thông minh.</p>
                                        </div>
                                    </div>
                                    <div className="flex items-start">
                                        <div className="mt-1 mr-4 text-gray-800"><Icons.MapPin /></div>
                                        <div>
                                            <h3 className="font-bold text-gray-900 mb-1">Vị trí trung tâm</h3>
                                            <p className="text-sm text-gray-500 font-medium">Cách nhà thờ Đức Bà 5 phút đi xe, gần trạm xe buýt.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="py-8">
                                    <h3 className="text-xl font-bold text-gray-900 mb-6">Tiện ích phong phú</h3>
                                    <div className="grid grid-cols-2 gap-y-5 gap-x-8">
                                        {["Điều hòa Inverter", "Wifi tốc độ cao miễn phí", "Tủ lạnh 2 cánh", "Máy giặt sấy trong phòng", "Smart TV 50 inch", "Bếp từ & Hút mùi"].map((item, i) => (
                                            <div key={i} className="flex items-center text-gray-700 font-medium">
                                                <span className="mr-3 text-gray-400"><Icons.Check /></span> {item}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Right Col (30%) - Sticky Box */}
                            <div className="lg:w-1/3">
                                <div className="bg-surface border border-gray-200 rounded-3xl shadow-floating p-6 lg:sticky lg:top-28">
                                    <div className="mb-6 flex items-baseline">
                                        <span className="text-3xl font-extrabold text-gray-900">6.500.000₫</span>
                                        <span className="text-gray-500 font-medium ml-1"> / tháng</span>
                                    </div>
                                    
                                    <div className="border border-gray-300 rounded-2xl mb-6 overflow-hidden focus-within:ring-2 focus-within:ring-teal-500 focus-within:border-teal-500 transition-all">
                                        <div className="p-4 border-b border-gray-300 bg-white">
                                            <div className="text-[10px] font-extrabold uppercase text-gray-800 tracking-wider mb-1">Lịch hẹn dự kiến</div>
                                            <input type="date" className="text-gray-900 font-bold outline-none w-full bg-transparent cursor-pointer" defaultValue="2026-05-15" />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => navigate('checkout')}
                                        className="w-full bg-coral hover:bg-red-500 text-white font-extrabold py-4 rounded-2xl text-lg transition-all shadow-md hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0"
                                    >
                                        Đặt Lịch Xem Phòng
                                    </button>
                                    
                                    <div className="mt-4 text-center text-sm font-medium text-gray-500">
                                        Chưa thu tiền cho đến khi bạn xác nhận cọc.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. DEPOSIT CHECKOUT (E-COMMERCE STYLE)
        const DepositCheckoutView = ({ navigate }) => {
            const [timeLeft, setTimeLeft] = useState(23 * 3600 + 59 * 60 + 59);

                    {toast && <Toast message={toast} onClose={() => setToast(null)} />}

            );
        };

        // --- ROOT APP COMPONENT ---
        const App = () => {
            const [currentView, setCurrentView] = useState('home');

            useEffect(() => { window.scrollTo(0, 0); }, [currentView]);

            // Determine if we should show the full nav or focus mode (checkout)
            const isFocusMode = currentView === 'checkout';

            return (
                <div className="flex flex-col min-h-screen">
                    {/* TOP NAVIGATION */}
                    <header className={`bg-surface border-b border-gray-100 sticky top-0 z-40 ${isFocusMode ? 'py-4' : 'h-20'} transition-all`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center justify-between">
                            
                            {/* Logo */}
                            <div className="flex items-center cursor-pointer group" onClick={() => !isFocusMode && setCurrentView('home')}>
                                <div className="w-10 h-10 bg-teal-600 rounded-xl text-white flex items-center justify-center font-bold text-xl mr-3 shadow-md group-hover:bg-teal-700 transition">H</div>
                                <span className="font-extrabold text-2xl text-gray-900 tracking-tight hidden sm:block">HomeStay<span className="text-teal-600">.</span></span>
                            </div>

                            {/* Center Menus (Hidden in Focus Mode) */}
                            {!isFocusMode && (
                                <nav className="hidden md:flex space-x-1 border border-gray-200 rounded-full p-1 shadow-sm bg-white">
                                    <button onClick={() => setCurrentView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition-all ${currentView === 'home' || currentView === 'detail' ? 'bg-gray-100 text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-50'}`}>Tìm phòng</button>
                                    <button className="px-5 py-2 rounded-full text-sm font-bold text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all">Lịch hẹn</button>
                                    <button onClick={() => setCurrentView('portal')} className={`px-5 py-2 rounded-full text-sm font-bold transition-all ${currentView === 'portal' ? 'bg-gray-100 text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-50'}`}>My Rent</button>
                                </nav>
                            )}

                            {/* Right Actions */}
                            <div className="flex items-center space-x-4">
                                {!isFocusMode && (
                                    <>
                                        <button className="text-gray-500 hover:text-gray-900 transition hidden sm:block font-bold text-sm flex items-center"><Icons.Globe/> <span className="ml-1 uppercase">VN</span></button>
                                        <button className="text-gray-500 hover:text-gray-900 transition relative p-2">
                                            <Icons.Bell />
                                            <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-coral rounded-full border-2 border-white"></span>
                                        </button>
                                    </>
                                )}
                                <div className="flex items-center cursor-pointer pl-1 pr-4 py-1 rounded-full border border-gray-200 hover:shadow-md transition bg-white gap-2">
                                    <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center overflow-hidden border border-gray-200">
                                        <img src="https://i.pravatar.cc/150?img=11" className="w-full h-full object-cover"/>
                                    </div>
                                    {!isFocusMode && <span className="text-sm font-extrabold text-gray-900 hidden sm:block">Khách</span>}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT ROUTER */}
                    <main className="flex-grow">
                        {currentView === 'home' && <HomeView navigate={setCurrentView} />}
                        {currentView === 'detail' && <RoomDetailView navigate={setCurrentView} />}
                        {currentView === 'checkout' && <DepositCheckoutView navigate={setCurrentView} />}
                        {currentView === 'portal' && <PortalView navigate={setCurrentView} />}
                    </main>

                    {/* FOOTER (Hidden in Focus Mode) */}
                    {!isFocusMode && (
                        <footer className="bg-white border-t border-gray-200 py-12 mt-auto">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
                                <div className="flex items-center mb-4 md:mb-0 opacity-50">
                                    <span className="font-extrabold text-xl text-gray-900">HomeStay.</span>
                                </div>
                                <div className="flex space-x-6 text-sm font-bold text-gray-500">
                                    <a href="#" className="hover:text-gray-900 transition">Quy định</a>
                                    <a href="#" className="hover:text-gray-900 transition">Bảo mật</a>
                                    <a href="#" className="hover:text-gray-900 transition">Hỗ trợ</a>
                                </div>
                            </div>
                        </footer>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
